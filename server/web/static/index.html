<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ambivox</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <main>
    <header>
      <h1>ambi<span>vox</span></h1>
      <p class="tagline">Speak your language. Be heard in theirs.</p>
    </header>

    <form id="join" autocomplete="off">
      <label>Your name
        <input id="name" maxlength="40" placeholder="Guest">
      </label>
      <label>Room
        <input id="room" required pattern="[A-Za-z0-9_\-]{1,64}" placeholder="kitchen-table">
      </label>
      <label>I speak
        <select id="lang">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
        </select>
      </label>
      <button type="submit">Join the call</button>
    </form>

    <section id="call" hidden>
      <div class="bar">
        <div>
          <strong id="room-label"></strong>
          <span id="peer-label" class="muted">Waiting for someone to join…</span>
        </div>
        <div class="actions">
          <button id="mute" type="button" aria-pressed="false">Mute</button>
          <button id="leave" type="button" class="danger">Leave</button>
        </div>
      </div>
      <p id="status" class="muted" role="status"></p>
      <ol id="captions" aria-live="polite"></ol>
    </section>

    <p id="error" role="alert" hidden></p>
    <audio id="remote" autoplay></audio>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
